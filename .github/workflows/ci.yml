# This repository is PUBLIC. This workflow must never consume secrets, and must
# never use `pull_request_target` — that would expose secrets to fork PRs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    # A gg-ci saját tesztjei; mért medián 30 mp (n=14, max 41 mp) — IT-278.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [test]
    uses: ./.github/workflows/quality-gate.yml
    with:
      needs-json: ${{ toJSON(needs) }}

