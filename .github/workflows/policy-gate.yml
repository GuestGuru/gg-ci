# Organization rulesets run this workflow from gg-ci, outside the target pull
# request's control. It verifies that each repository still wires its real
# mandatory jobs into the canonical delivery gate.
name: Policy gate

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  workflow-policy:
    name: workflow-policy
    # Runner selection (IT-570). An organization ruleset injects this workflow
    # into the target repository, so it cannot take inputs -- the label comes
    # instead from the target repository's `GG_CI_RUNNER` organization
    # variable, and this public repository names no runner of its own:
    #   * unset (public repositories, and any repository the variable is not
    #     shared with) -> `ubuntu-latest`, the GitHub-hosted default;
    #   * set         -> that self-hosted label.
    # `schedule` is excluded on purpose: a self-hosted runner may be asleep at
    # cron time, so scheduled work always stays on GitHub-hosted runners.
    # Deleting the organization variable moves every caller back to
    # `ubuntu-latest` in one step -- the emergency brake when the self-hosted
    # runner is unavailable.
    runs-on: ${{ (github.event_name != 'schedule' && vars.GG_CI_RUNNER) || 'ubuntu-latest' }}
    # Statikus inventory-ellenőrzés, mért futásidő ~12 mp (IT-278).
    timeout-minutes: 10
    steps:
      - name: Check out target repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: target

      - name: Check out trusted policy implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .policy

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .policy/package-lock.json

      - run: npm ci --ignore-scripts --prefix .policy --userconfig=/dev/null
      - run: node .policy/node_modules/tsx/dist/cli.mjs .policy/src/workflow-policy.ts "$GITHUB_WORKSPACE/target"
        env:
          NODE_OPTIONS: ""
