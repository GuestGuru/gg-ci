# IT-2105 — a gg-runner VM (Colima `ci`) work-diszkje a gazdagépen (gg-mb) egy ritka
# lemezfájl, amely csak trimkor adja vissza a VM-en belül felszabadult blokkokat.
# Mérve 2026-11-04: a heti (hétfői) alap-fstrim mellett a CI-forgalom hetente kb.
# 13 GB-ot halmozott fel a gazdagépen, amely ekkor 99%-on állt. Naponta trimelünk.
# Telepíti: runner/install.sh → /etc/systemd/system/fstrim.timer.d/gg-daily.conf
[Timer]
OnCalendar=
OnCalendar=daily
